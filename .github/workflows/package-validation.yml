name: Package validation
on:
  workflow_call:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  native:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
      - name: Verify release tag
        if: startsWith(github.ref, 'refs/tags/')
        run: node -e 'if (process.env.GITHUB_REF_NAME !== "v" + JSON.parse(require("fs").readFileSync("package.json")).version) process.exit(1)'
      - run: |
          sudo apt-get update
          sudo apt-get install -y python3-gi gir1.2-gtk-4.0 gir1.2-adw-1 gir1.2-webkit-6.0 xvfb dbus-x11
      - name: Allow sandbox namespaces in the disposable test VM only
        run: sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0
      - run: npm ci --ignore-scripts
      - run: npm run check
      - run: npm audit --audit-level=moderate
      - run: python3 scripts/package-release.py
      - run: xvfb-run -a dbus-run-session -- env NIIMSTUDIO_TEST_INSTALLED_GUI=1 python3 scripts/test-release-install.py .release
      - uses: actions/upload-artifact@v5
        with:
          name: native
          path: .release/*
          include-hidden-files: true
          if-no-files-found: error
  flatpak:
    needs: native
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: x86_64
            runner: ubuntu-24.04
          - arch: aarch64
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v5
      - uses: actions/download-artifact@v5
        with:
          name: native
          path: .release
      - run: |
          sudo apt-get update
          sudo apt-get install -y flatpak flatpak-builder xvfb dbus-x11
          flatpak remote-add --user --if-not-exists flathub https://flathub.org/repo/flathub.flatpakrepo
      - name: Allow sandbox namespaces in the disposable test VM only
        run: sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0
      - name: Build and install Flatpak with its runtime
        run: flatpak-builder --user --install-deps-from=flathub --force-clean --repo=.flatpak-repo --install .flatpak-build packaging/flatpak/io.github.niimstudio.App.json
      - name: Export installable bundle
        env:
          ARCH: ${{ matrix.arch }}
        run: flatpak build-bundle --runtime-repo=https://flathub.org/repo/flathub.flatpakrepo .flatpak-repo ".release/niimstudio-linux-$ARCH.flatpak" io.github.niimstudio.App
      - name: Install exported bundle twice and test its real GUI and data retention
        env:
          ARCH: ${{ matrix.arch }}
        run: |
          source <(sed '$d' install.sh)
          flatpak uninstall --user -y io.github.niimstudio.App
          mkdir -p "$HOME/.var/app/io.github.niimstudio.App/data/niimstudio"
          echo synthetic-retained-data > "$HOME/.var/app/io.github.niimstudio.App/data/niimstudio/installer-fixture.txt"
          install_flatpak_bundle ".release/niimstudio-linux-$ARCH.flatpak"
          install_flatpak_bundle ".release/niimstudio-linux-$ARCH.flatpak"
          original_commit="$(flatpak info --user --show-commit io.github.niimstudio.App)"
          echo synthetic-update > .flatpak-build/files/share/niimstudio/installer-update-fixture.txt
          flatpak build-export .flatpak-update-repo .flatpak-build
          flatpak build-bundle --runtime-repo=https://flathub.org/repo/flathub.flatpakrepo .flatpak-update-repo .flatpak-update.flatpak io.github.niimstudio.App
          install_flatpak_bundle .flatpak-update.flatpak
          test "$(flatpak info --user --show-commit io.github.niimstudio.App)" != "$original_commit"
          install_flatpak_bundle ".release/niimstudio-linux-$ARCH.flatpak"
          test "$(flatpak info --user --show-commit io.github.niimstudio.App)" = "$original_commit"
          grep -qx synthetic-retained-data "$HOME/.var/app/io.github.niimstudio.App/data/niimstudio/installer-fixture.txt"
          flatpak run io.github.niimstudio.App --version
          xvfb-run -a dbus-run-session -- flatpak run io.github.niimstudio.App --smoke-test
      - uses: actions/upload-artifact@v5
        with:
          name: flatpak-${{ matrix.arch }}
          path: .release/*.flatpak
          include-hidden-files: true
          if-no-files-found: error
