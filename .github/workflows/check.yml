name: Checks
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  lint-test-build:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - name: Install native introspection dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y python3-gi gir1.2-gtk-4.0 gir1.2-adw-1 gir1.2-webkit-6.0
      - run: npm ci --ignore-scripts
      - run: npm run check
      - run: npm audit --audit-level=moderate
      - run: bash -n install.sh scripts/niimstudio packaging/flatpak/flatpak-launch
      - run: python3 scripts/package-release.py
      - run: python3 scripts/test-release-install.py .release
