name: Release
on:
  push:
    tags: ['v[0-9]*']
permissions:
  contents: read
jobs:
  build-and-test:
    uses: ./.github/workflows/package-validation.yml
  publish:
    needs: build-and-test
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          path: .release
          merge-multiple: true
      - name: Checksum all release assets
        working-directory: .release
        run: sha256sum niimstudio-linux.tar.gz install.sh *.flatpak > SHA256SUMS
      - name: Publish v0.1.0
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" .release/niimstudio-linux.tar.gz .release/SHA256SUMS .release/install.sh .release/*.flatpak --verify-tag --title "NiimStudio $GITHUB_REF_NAME" --notes-file docs/RELEASE-NOTES.md
