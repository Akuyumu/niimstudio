name: Release
on:
  push:
    tags: ['v[0-9]*']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  native:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - name: Verify release tag
        if: startsWith(github.ref, 'refs/tags/')
        run: node -e 'if (process.env.GITHUB_REF_NAME !== "v" + JSON.parse(require("fs").readFileSync("package.json")).version) process.exit(1)'
      - run: |
          sudo apt-get update
          sudo apt-get install -y python3-gi gir1.2-gtk-4.0 gir1.2-adw-1 gir1.2-webkit-6.0 xvfb dbus-x11
      - run: npm ci --ignore-scripts
      - run: npm run check
      - run: npm audit --audit-level=moderate
      - run: python3 scripts/package-release.py
      - run: xvfb-run -a dbus-run-session -- env NIIMSTUDIO_TEST_INSTALLED_GUI=1 python3 scripts/test-release-install.py .release
      - uses: actions/upload-artifact@v4
        with:
          name: native
          path: .release/*
  flatpak:
    needs: native
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: x86_64
            runner: ubuntu-24.04
          - arch: aarch64
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: native
          path: .release
      - run: |
          sudo apt-get update
          sudo apt-get install -y flatpak flatpak-builder xvfb dbus-x11
          flatpak remote-add --user --if-not-exists flathub https://flathub.org/repo/flathub.flatpakrepo
      - name: Build and install Flatpak with its runtime
        run: flatpak-builder --user --install-deps-from=flathub --force-clean --repo=.flatpak-repo --install .flatpak-build packaging/flatpak/io.github.niimstudio.App.json
      - name: Test actual GTK/WebKit inside the sandbox
        run: |
          flatpak run io.github.niimstudio.App --version
          xvfb-run -a dbus-run-session -- flatpak run io.github.niimstudio.App --smoke-test
      - name: Export installable bundle
        env:
          ARCH: ${{ matrix.arch }}
        run: flatpak build-bundle --runtime-repo=https://flathub.org/repo/flathub.flatpakrepo .flatpak-repo ".release/niimstudio-linux-$ARCH.flatpak" io.github.niimstudio.App
      - uses: actions/upload-artifact@v4
        with:
          name: flatpak-${{ matrix.arch }}
          path: .release/*.flatpak
  publish:
    if: startsWith(github.ref, 'refs/tags/')
    needs: [native, flatpak]
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          path: .release
          merge-multiple: true
      - name: Checksum all release assets
        working-directory: .release
        run: sha256sum niimstudio-linux.tar.gz install.sh *.flatpak > SHA256SUMS
      - name: Publish v0.1.0
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" .release/niimstudio-linux.tar.gz .release/SHA256SUMS .release/install.sh .release/*.flatpak --verify-tag --title "NiimStudio $GITHUB_REF_NAME" --notes-file docs/RELEASE-NOTES.md
